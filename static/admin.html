<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chatbot admin</title>
<style>
:root{--ink:#1b2430;--mute:#64707f;--line:#dde2e8;--acc:#1f6f4a}
body{font:15px/1.5 system-ui,sans-serif;color:var(--ink);max-width:760px;margin:32px auto;padding:0 16px}
h1{font-size:22px}h2{font-size:16px;margin:28px 0 8px}
section{border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:16px}
input[type=text],input[type=password],input[type=number]{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px}
button{font:inherit;padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;word-break:break-word}
#msg{color:var(--mute);min-height:1.5em;margin-top:10px}
</style></head>
<body>
<h1>Chatbot knowledge base</h1>
<section><div class="row"><label for="tok">Admin token</label><input id="tok" type="password" autocomplete="off">
<button class="p" id="load">Sign in</button></div></section>
<section><h2>Add a website</h2><div class="row">
<input id="url" type="text" value="https://sigmoss.com" size="34" aria-label="Website URL">
<input id="max" type="number" value="30" min="1" max="100" style="width:80px" aria-label="Max pages">
<button class="p" id="crawl">Crawl website</button></div>
<p style="color:var(--mute);margin:8px 0 0">Reads same-site pages and replaces older copies of the same page.</p></section>
<section><h2>Upload documents</h2><div class="row"><input id="files" type="file" accept=".pdf,.txt,.md" multiple>
<button class="p" id="up">Upload</button></div></section>
<div id="msg" aria-live="polite"></div>
<section><h2>Sources in use</h2><table><thead><tr><th>Name</th><th>Type</th><th>Chunks</th><th></th></tr></thead><tbody id="rows"></tbody></table></section>
<script>
const $=s=>document.querySelector(s), msg=t=>$("#msg").textContent=t;
const H=()=>({"X-Admin-Token":$("#tok").value});
const esc=t=>t.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{...H(),...(opt.headers||{})}});const d=await r.json();if(!r.ok)throw new Error(d.detail||"Request failed");return d}
async function list(){try{const s=await api("/api/admin/sources");
 $("#rows").innerHTML=s.length?s.map(x=>`<tr><td>${esc(x.name)}<br><small style="color:var(--mute)">${esc(x.source)}</small></td><td>${x.kind}</td><td>${x.chunks}</td><td><button data-id="${x.doc_id}">Remove</button></td></tr>`).join(""):"<tr><td colspan=4>Nothing indexed yet.</td></tr>";
 msg("")}catch(e){msg(e.message)}}
$("#load").onclick=list;
$("#rows").onclick=async e=>{const id=e.target.dataset.id;if(!id)return;try{await api("/api/admin/sources/"+id,{method:"DELETE"});list()}catch(x){msg(x.message)}};
$("#crawl").onclick=async()=>{msg("Crawling… this can take a minute.");try{const r=await api("/api/admin/crawl",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url:$("#url").value,max_pages:+$("#max").value})});msg(`Indexed ${r.pages} page(s).`);list()}catch(e){msg(e.message)}};
$("#up").onclick=async()=>{const f=$("#files").files;if(!f.length)return msg("Choose at least one file.");const fd=new FormData();[...f].forEach(x=>fd.append("files",x));msg("Indexing…");
 try{const r=await api("/api/admin/upload",{method:"POST",body:fd});msg(`Added ${r.added.length} file(s).`+(r.errors.length?" Problems: "+r.errors.map(e=>e.name+": "+e.error).join("; "):""));$("#files").value="";list()}catch(e){msg(e.message)}};
</script></body></html>
